<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Match RPG</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121622;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #game {
      width: min(94vw, 520px);
      text-align: center;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 32px;
    }

    #board {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      padding: 8px;
      background: #22293d;
      border-radius: 18px;
    }

    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      font-size: clamp(28px, 9vw, 46px);
      background: #39405a;
      cursor: pointer;
      user-select: none;
      touch-action: none;
      transition: transform 0.12s ease, outline 0.12s ease;
    }

    .tile:active {
      transform: scale(0.92);
    }

    .tile.selected {
      outline: 4px solid white;
      transform: scale(0.9);
    }

    #message {
      min-height: 28px;
      margin-top: 14px;
      color: #cad1e5;
      font-size: 15px;
    }

    #reset {
      margin-top: 10px;
      padding: 12px 24px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: #121622;
      font-size: 16px;
      font-weight: bold;
    }

    #reset:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

  <div id="game">

    <h1>⚔️ Match RPG</h1>

    <div id="board"></div>

    <div id="message">
      Tap two tiles or swipe a tile.
    </div>

    <button id="reset">
      New Board
    </button>

  </div>

  <script>
    const ROWS = 6;
    const COLS = 6;

    const TYPES = [
      "⚔️",
      "🔥",
      "🛡️",
      "❤️"
    ];

    let board = [];
    let selected = null;
    let pointerStart = null;
    let swipeHappened = false;

    const boardEl = document.getElementById("board");
    const messageEl = document.getElementById("message");
    const resetBtn = document.getElementById("reset");


    function randomType() {
      return Math.floor(
        Math.random() * TYPES.length
      );
    }


    function createBoard() {

      board = [];

      for (let row = 0; row < ROWS; row++) {

        board[row] = [];

        for (let col = 0; col < COLS; col++) {

          let type;

          do {

            type = randomType();

          } while (

            (
              col >= 2 &&
              board[row][col - 1] === type &&
              board[row][col - 2] === type
            )

            ||

            (
              row >= 2 &&
              board[row - 1][col] === type &&
              board[row - 2][col] === type
            )

          );

          board[row][col] = type;
        }
      }

      selected = null;

      messageEl.textContent =
        "Tap two tiles or swipe a tile.";

      renderBoard();
    }


    function renderBoard() {

      boardEl.innerHTML = "";

      for (let row = 0; row < ROWS; row++) {

        for (let col = 0; col < COLS; col++) {

          const tile =
            document.createElement("div");

          tile.className = "tile";

          tile.textContent =
            TYPES[board[row][col]];

          if (
            selected &&
            selected.row === row &&
            selected.col === col
          ) {

            tile.classList.add("selected");
          }


          tile.addEventListener(
            "pointerdown",
            function (event) {

              pointerStart = {
                row: row,
                col: col,
                x: event.clientX,
                y: event.clientY
              };

              swipeHappened = false;

              try {
                tile.setPointerCapture(
                  event.pointerId
                );
              } catch (error) {
              }
            }
          );


          tile.addEventListener(
            "pointerup",
            function (event) {

              if (!pointerStart) {
                return;
              }

              const dx =
                event.clientX -
                pointerStart.x;

              const dy =
                event.clientY -
                pointerStart.y;

              const distance =
                Math.max(
                  Math.abs(dx),
                  Math.abs(dy)
                );

              if (distance >= 25) {

                swipeHappened = true;

                let targetRow =
                  pointerStart.row;

                let targetCol =
                  pointerStart.col;


                if (
                  Math.abs(dx) >
                  Math.abs(dy)
                ) {

                  if (dx > 0) {
                    targetCol++;
                  } else {
                    targetCol--;
                  }

                } else {

                  if (dy > 0) {
                    targetRow++;
                  } else {
                    targetRow--;
                  }

                }


                if (
                  targetRow >= 0 &&
                  targetRow < ROWS &&
                  targetCol >= 0 &&
                  targetCol < COLS
                ) {

                  swapTiles(
                    pointerStart.row,
                    pointerStart.col,
                    targetRow,
                    targetCol
                  );

                  messageEl.textContent =
                    "Swipe move!";
                }
              }

              pointerStart = null;
            }
          );


          tile.addEventListener(
            "click",
            function () {

              if (swipeHappened) {

                swipeHappened = false;
                return;
              }

              tapTile(row, col);
            }
          );


          boardEl.appendChild(tile);
        }
      }
    }


    function tapTile(row, col) {

      if (!selected) {

        selected = {
          row: row,
          col: col
        };

        messageEl.textContent =
          "Now tap an adjacent tile.";

        renderBoard();

        return;
      }


      if (
        selected.row === row &&
        selected.col === col
      ) {

        selected = null;

        messageEl.textContent =
          "Selection cancelled.";

        renderBoard();

        return;
      }


      const distance =
        Math.abs(
          selected.row - row
        ) +
        Math.abs(
          selected.col - col
        );


      if (distance === 1) {

        swapTiles(
          selected.row,
          selected.col,
          row,
          col
        );

        messageEl.textContent =
          "Tap swap!";

        return;
      }


      selected = {
        row: row,
        col: col
      };

      messageEl.textContent =
        "Choose an adjacent tile.";

      renderBoard();
    }


    function swapTiles(
      row1,
      col1,
      row2,
      col2
    ) {

      const temp =
        board[row1][col1];

      board[row1][col1] =
        board[row2][col2];

      board[row2][col2] =
        temp;

      selected = null;

      renderBoard();
    }


    resetBtn.addEventListener(
      "click",
      createBoard
    );


    createBoard();
  </script>

</body>
</html>
