<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Match RPG</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game">

    <h1>⚔️ Match RPG</h1>

    <div id="combat">

      <div class="fighter" id="playerCard">

        <div class="portrait">
          🧙
        </div>

        <div class="name">
          Hero
        </div>

        <div class="bar-wrap">
          <div
            class="hp-bar"
            id="playerHpBar"
          ></div>
        </div>

        <div
          class="hp-text"
          id="playerHpText"
        >
          100 / 100 HP
        </div>

        <div id="shieldText">
          Shield: 0
        </div>

      </div>


      <div
        class="fighter"
        id="enemyCard"
      >

        <div class="portrait">
          👹
        </div>

        <div class="name">
          Goblin
        </div>

        <div class="bar-wrap">
          <div
            class="hp-bar"
            id="enemyHpBar"
          ></div>
        </div>

        <div
          class="hp-text"
          id="enemyHpText"
        >
          100 / 100 HP
        </div>

      </div>

    </div>


    <div id="battleMessage">
      Defeat the Goblin.
    </div>


    <div id="combo"></div>


    <div id="board"></div>


    <div id="message">
      Swipe a tile or tap two adjacent tiles.
    </div>


    <div id="legend">
      ⚔️ 10 damage/tile • 🔥 15 damage/tile
      <br>
      ❤️ heal 8/tile • 🛡️ shield 8/tile
    </div>


    <button id="reset">
      New Board
    </button>


    <button id="restart">
      Fight Again
    </button>

  </div>


  <script src="game.js"></script>

</body>
</html>
